  <body class="bg-[#F4F8F6] text-[#052E1F] dark:bg-[#02120C] dark:text-emerald-50 antialiased selection:bg-emerald-200 selection:text-emerald-950 dark:selection:bg-emerald-800 dark:selection:text-emerald-50 transition-colors duration-150">
    <script>
      try {
        var t = localStorage.getItem('baust_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
